      node.innerHTML = `<strong>${esc(toast.message)}</strong>${toast.rule ? `<span>${esc(toast.rule)}</span>` : ""}`;
      clearTimeout(renderToast.timer);
      renderToast.timer = setTimeout(() => { state.ui.fixture.toast = null; renderToast(); }, 4200);
    }

    function loadScenario(id) {
      const theme = state.ui.theme;
      state = createState();
      state.ui.theme = theme;
      state.ui.fixture.scenarioId = id;
      const teacherScenarios = new Set(["archive-blocked", "archived-readonly", "batch-invalid", "batch-valid-preview", "snapshot-edited-source", "second-question-open", "race-submit-first", "race-close-first", "auto-closed"]);
      state.ui.mode = teacherScenarios.has(id) ? "teacher" : "student";
      const teacher = state.ui.teacher;
      const student = state.ui.student;
      const active = getSession("session-active");

      if (["waiting-room"].includes(id)) {
        student.sessionId = "session-waiting";
        seedStudentParticipant("session-waiting", "小明");
        student.view = "waiting";
      } else if (["active-poll", "submission-duplicate", "race-submit-first", "race-close-first"].includes(id)) {
        seedStudentParticipant("session-active", "小明");
        student.view = "classroom";
      } else if (id === "active-quiz") {
        active.activeQuestionId = "sq-quiz";
        getSessionQuestion("sq-poll-open").status = "not_open";
        getSessionQuestion("sq-quiz").status = "open";
        seedStudentParticipant("session-active", "小明");
        student.view = "classroom";
      } else if (id === "active-open-text") {
        active.activeQuestionId = "sq-open";
        getSessionQuestion("sq-poll-open").status = "not_open";
        getSessionQuestion("sq-open").status = "open";
        seedStudentParticipant("session-active", "小明");
        student.view = "classroom";
      } else if (id === "closed-results") {
        student.sessionId = "session-closed";
        seedStudentParticipant("session-closed", "小明");
        student.view = "ended";
      } else if (id === "cancelled-empty") {
        student.sessionId = "session-cancelled";
        student.view = "ended";
      } else if (id === "archive-blocked") {
        teacher.courseId = "course-draft";
        teacher.sessionId = "session-active";
        teacher.view = "courses";
      } else if (id === "archived-readonly") {
        teacher.courseId = "course-archived";
        teacher.sessionId = "session-closed";
        teacher.view = "question-bank";
      } else if (id === "batch-invalid" || id === "batch-valid-preview") {
        teacher.view = "question-bank";
        teacher.batchFixture = id === "batch-invalid" ? "invalid" : "valid-warning";
        loadBatchFixture(false);
        if (id === "batch-valid-preview") validateBatch(false);
      } else if (id === "snapshot-edited-source") {
        teacher.view = "classroom";
        teacher.sessionId = "session-active";
        const source = getQuestion("q-poll");
        source.prompt = "來源題幹已被修改（snapshot 應該不變）";
      } else if (id === "second-question-open") {
        teacher.view = "classroom";
        teacher.sessionId = "session-active";
      } else if (id === "race-submit-first" || id === "race-close-first") {
        teacher.view = "classroom";
        teacher.sessionId = "session-active";
        teacher.raceMode = id === "race-submit-first" ? "submit-first" : "close-first";
        state.ui.fixture.raceMode = teacher.raceMode;
        addEvent(id === "race-submit-first" ? "fixture：Submission 先 commit，答案保留" : "fixture：close 先 commit，後續答案拒絕", id === "race-submit-first" ? "success" : "error", "R-F15-1");
      } else if (id === "auto-closed") {
        teacher.view = "classroom";
        teacher.sessionId = "session-active";
        active.status = "closed";
        active.autoClosed = true;
        active.closedAt = "2026-08-14 17:06 (+8h fixture)";
        getSessionQuestion("sq-poll-open").status = "closed";
      }
      if (id === "active-poll") student.view = "classroom";
      addEvent(`載入 scenario：${id}`, "info", "prototype fixture");
      render();
    }

    function seedStudentParticipant(sessionId, displayName, submittedAnswer = null) {
      const participant = { id: "participant-demo", liveSessionId: sessionId, displayName, tokenLabel: "fixture ····7A", joinedAt: "2026-08-14 09:06" };
      state.domain.participants.push(participant);
      state.ui.student.sessionId = sessionId;
      state.ui.student.participantId = participant.id;
      state.ui.student.tokenState = "available";
      state.ui.student.tokenLabel = participant.tokenLabel;
      if (submittedAnswer) createSubmission(participant.id, getCurrentStudentQuestion()?.id, submittedAnswer, "idem-fixture-1", false);
    }

    function createSubmission(participantId, sqId, answer, idempotencyKey, announce = true) {
      if (!participantId || !sqId) return null;
      const submission = { id: nextId("submission"), participantId, liveSessionId: getSessionQuestion(sqId)?.liveSessionId, sessionQuestionId: sqId, idempotencyKey, answer, submittedAt: "server fixture time" };
      state.domain.submissions.push(submission);
      const sq = getSessionQuestion(sqId);
      if (sq?.aggregate) {
        if (Array.isArray(answer)) answer.forEach(id => incrementAggregate(sq, id));
        else if (typeof answer === "string" && sq.snapshot.type !== "open_text") incrementAggregate(sq, answer);
        else if (typeof answer === "string" && sq.snapshot.type === "open_text") { sq.aggregate.textResponses.push(answer); sq.aggregate.total += 1; }
      }
      state.ui.student.submittedByQuestion[sqId] = submission.id;
      if (announce) succeed("Submission 已建立；答案鎖定。", "R-F14-1 · R-F14-2");
      return submission;
    }

    function incrementAggregate(sq, optionId) {
      const item = sq.aggregate.options.find(option => option.id === optionId);
      if (item) { item.count += 1; sq.aggregate.total += 1; }
    }

    function handleInput(event) {
      const target = event.target;
      if (!target.closest("#app")) return;
      const model = target.dataset.model;
      if (model === "student-code") state.ui.student.joinCode = target.value.toUpperCase();
      if (model === "student-name") state.ui.student.joinName = target.value;
      if (model === "student-text-answer") state.ui.student.draftAnswer = target.value;
      if (model === "editor-prompt") state.ui.teacher.editorDraft.prompt = target.value;
      if (model === "editor-option") state.ui.teacher.editorDraft.options[Number(target.dataset.index)] = target.value;
      if (model === "new-course-name") state.ui.teacher.newCourseName = target.value;
    }

    function handleChange(event) {
      const target = event.target;
      if (!target.closest("#app")) return;
      const model = target.dataset.model;
      if (model === "student-choice") {
        const sq = getCurrentStudentQuestion();
        if (!sq) return;
        const quizMultiple = sq.snapshot.type === "quiz" && sq.snapshot.options.filter(item => item.isCorrect).length > 1;
        if (quizMultiple) {
          const checked = [...document.querySelectorAll("input[data-model=student-choice]:checked")].map(input => input.value);
          state.ui.student.draftAnswer = checked;
        } else state.ui.student.draftAnswer = target.value;
      }
      if (model === "editor-type") {
        const draft = state.ui.teacher.editorDraft;
        draft.type = target.value;
        if (draft.type === "open_text") { draft.options = []; draft.correctIndices = []; }
        else if (!draft.options.length) draft.options = ["", ""];
        render();
      }
      if (model === "editor-selection") state.ui.teacher.editorDraft.selectionMode = target.value;
      if (model === "editor-correct") {
        const index = Number(target.dataset.index);
        const indices = new Set(state.ui.teacher.editorDraft.correctIndices);
        if (target.checked) indices.add(index); else indices.delete(index);
        state.ui.teacher.editorDraft.correctIndices = [...indices].sort((a, b) => a - b);
      }
      if (model === "setup-question") {
        const id = target.dataset.question;
        const selected = new Set(state.ui.teacher.selectedQuestionIds);
        if (target.checked) selected.add(id); else selected.delete(id);
        state.ui.teacher.selectedQuestionIds = [...selected];
        render();
      }
      if (model === "batch-fixture") {
        state.ui.teacher.batchFixture = target.value;
        state.ui.teacher.batchDraft = null;
        state.ui.teacher.batchStatus = "idle";
        state.ui.teacher.batchMessages = [];
        state.ui.teacher.batchPreviewVisible = false;
        render();
      }
    }

    function handleSubmit(event) {
      const form = event.target;
      if (!form.dataset.form) return;
      event.preventDefault();
      if (form.dataset.form === "student-join") studentJoin();
      if (form.dataset.form === "student-answer") studentSubmit();
      if (form.dataset.form === "teacher-editor") teacherValidateSingle();
    }

    function handleClick(event) {
      const actionNode = event.target.closest("[data-action]");
      if (!actionNode) return;
      const action = actionNode.dataset.action;
      if (action === "set-mode") {
        state.ui.mode = actionNode.dataset.mode;
        if (state.ui.mode === "teacher" && !state.ui.teacher.view) state.ui.teacher.view = "courses";
        render();
        return;
      }
      if (action === "toggle-theme") {
        state.ui.theme = state.ui.theme === "projector" ? "paper" : "projector";
        render();
        return;
      }
      if (action === "navigate") {
        const mode = actionNode.dataset.mode || state.ui.mode;
        state.ui[mode].view = actionNode.dataset.view;
        render();
        return;
      }
      if (action === "load-scenario") { loadScenario(actionNode.dataset.scenario); return; }
      switch (action) {
        case "copy-code": copyCurrentCode(); break;
        case "student-refresh": studentRefresh(); break;
        case "student-reconnect": studentReconnect(); break;
        case "student-disconnect": studentDisconnect(); break;
        case "student-safe-retry": studentSafeRetry(); break;
        case "student-conflict-retry": studentConflictRetry(); break;
        case "student-multitab": studentMultitab(); break;
        case "teacher-select-account": state.ui.teacher.accountId = actionNode.dataset.account; render(); break;
        case "teacher-create-course": teacherCreateCourse(); break;
        case "teacher-select-course": state.ui.teacher.courseId = actionNode.dataset.course; state.ui.teacher.view = "courses"; render(); break;
        case "teacher-go-question-bank": state.ui.teacher.courseId = actionNode.dataset.course; state.ui.teacher.view = "question-bank"; render(); break;
        case "teacher-archive-course": teacherArchiveCourse(actionNode.dataset.course); break;
        case "teacher-attempt-edit": teacherAttemptEdit(actionNode.dataset.course); break;
        case "teacher-open-editor": teacherOpenEditor(); break;
        case "teacher-close-editor": state.ui.teacher.editorOpen = false; render(); break;
        case "teacher-add-option": teacherAddOption(); break;
        case "teacher-remove-option": teacherRemoveOption(); break;
        case "teacher-load-batch": loadBatchFixture(true); break;
        case "teacher-validate-batch": validateBatch(true); break;
        case "teacher-mutate-batch": mutateBatch(); break;
        case "teacher-show-preview": teacherShowPreview(); break;
        case "teacher-confirm-batch": teacherConfirmBatch(); break;
        case "teacher-create-session": teacherCreateSession(); break;
        case "teacher-move-question": teacherMoveQuestion(actionNode.dataset.question, actionNode.dataset.direction); break;
        case "teacher-start-session": teacherStartSession(); break;
        case "teacher-cancel-session": teacherCancelSession(); break;
        case "teacher-open-question": teacherOpenQuestion(actionNode.dataset.question); break;
        case "teacher-close-question": teacherCloseQuestion(actionNode.dataset.question); break;
        case "teacher-reopen-question": teacherReopenQuestion(actionNode.dataset.question); break;
        case "teacher-close-session": teacherCloseSession(false); break;
        case "teacher-auto-close": teacherCloseSession(true); break;
        case "teacher-edit-source": teacherEditSource(actionNode.dataset.question); break;
        case "teacher-select-session": state.ui.teacher.sessionId = actionNode.dataset.session; state.ui.teacher.view = "classroom"; render(); break;
        case "clear-race": state.ui.fixture.raceMode = null; render(); break;
        default: break;
      }
    }

    function studentJoin() {
      const code = String(state.ui.student.joinCode || "").trim().toUpperCase();
      const name = String(state.ui.student.joinName || "").trim();
      if (!guard(VALID_CODE.test(code), "session code 必須是 8 碼且不含混淆字元。", "R-F3-1 · R-F3-2")) { render(); return; }
      const session = state.domain.liveSessions.find(item => item.sessionCode === code);
      if (!guard(Boolean(session) && ["waiting", "active"].includes(session?.status), "找不到有效的 waiting/active 場次；舊 code 不會重新啟用。", "R-F3-3 · R-F3-4")) { render(); return; }
      if (!guard(isSafeDisplayName(name), "顯示名稱需為 1–40 個安全 Unicode 字元，不能含控制或方向控制字元。", "R-F12-5")) { render(); return; }
      const participant = { id: nextId("participant"), liveSessionId: session.id, displayName: name, tokenLabel: `fixture ····${String(state.domain.counters.participant).padStart(2, "0")}`, joinedAt: "server fixture time" };
      state.domain.participants.push(participant);
      session.joinedCount += 1;
      state.ui.student.sessionId = session.id;
      state.ui.student.participantId = participant.id;
      state.ui.student.tokenState = "available";
      state.ui.student.tokenLabel = participant.tokenLabel;
      state.ui.student.reconnectState = "connected";
      state.ui.student.draftAnswer = null;
      state.ui.student.idempotencyKey = null;
      state.ui.student.view = session.status === "waiting" ? "waiting" : "classroom";
      succeed(`已加入 ${session.sessionCode}；取得場次限定 participant fixture。`, "R-F12-1 · R-F12-2");
      render();
    }

    function studentRefresh() {
      const session = getCurrentStudentSession();
      if (!session) return;
      addEvent(`重新取得 server fixture：${formatStatus(session.status)}`, "info", "R-F13-1 · R-F13-2");
      if (session.status === "waiting") state.ui.student.view = "waiting";
      else if (session.status === "active") state.ui.student.view = "classroom";
      else state.ui.student.view = "ended";
      render();
    }

    function studentDisconnect() {
      if (!guard(Boolean(state.ui.student.participantId), "尚未加入場次，沒有可重連的 token fixture。", "R-F13-1")) { render(); return; }
      state.ui.student.reconnectState = "disconnected";
      addEvent("模擬斷線：暫停本地畫面，server fixture 仍是權威", "info", "R-F13-2");
      render();
    }

    function studentReconnect() {
      const session = getCurrentStudentSession();
      if (!guard(Boolean(state.ui.student.tokenState === "available"), "沒有有效的場次限定 token fixture。", "R-F13-1")) { render(); return; }
      if (!guard(Boolean(session) && ["waiting", "active"].includes(session?.status), "場次已終止；原 token 不可重連。", "R-F13-3")) { render(); return; }
      state.ui.student.reconnectState = "connected";
      state.ui.student.view = session.status === "waiting" ? "waiting" : "classroom";
      succeed("以原 token fixture 恢復最新場次、目前題目與已提交狀態。", "R-F13-1 · R-F13-2");
      render();
    }

    function studentSubmit() {
      const session = getCurrentStudentSession();
      const sq = getCurrentStudentQuestion();
      const participant = getParticipant(state.ui.student.participantId);
      if (!guard(Boolean(session) && session.status === "active", "只有 active LiveSession 可以提交。", "R-F14-6")) { render(); return; }
      if (!guard(Boolean(sq) && sq.status === "open", "這一題還沒有 open；提交被拒絕。", "R-F14-6")) { render(); return; }
      if (!guard(Boolean(participant), "找不到 participant fixture；請重新加入。", "R-F12-2")) { render(); return; }
      if (!guard(!getStudentSubmission(sq.id), "這一題已經有第一次有效答案，不能覆寫。", "R-F14-1 · R-F14-2")) { render(); return; }
      const answer = state.ui.student.draftAnswer;
      const valid = sq.snapshot.type === "open_text" ? typeof answer === "string" && answer.trim().length > 0 && charCount(answer) <= 2000 : Array.isArray(answer) ? answer.length > 0 : Boolean(answer);
      if (!guard(valid, "請先選擇答案或輸入文字，再提交。", "R-F14-6")) { render(); return; }
      state.ui.student.idempotencyKey = state.ui.student.idempotencyKey || `idem-fixture-${sq.id}`;
      createSubmission(participant.id, sq.id, Array.isArray(answer) ? [...answer] : String(answer).trim(), state.ui.student.idempotencyKey, true);
      render();
    }

    function studentSafeRetry() {
      const sq = getCurrentStudentQuestion();
      const submission = sq ? getStudentSubmission(sq.id) : null;
      if (!guard(Boolean(submission), "目前沒有可安全重送的第一次結果。", "R-F14-3")) { render(); return; }
      addEvent("相同 idempotency key 命中第一次結果；沒有新增 Submission。", "success", "R-F14-3");
      render();
    }

    function studentConflictRetry() {
      const sq = getCurrentStudentQuestion();
      const submission = sq ? getStudentSubmission(sq.id) : null;
      if (!guard(Boolean(submission), "尚未有第一次答案，無法模擬不同答案衝突。", "R-F14-4")) { render(); return; }
      guard(false, "不同答案重送被拒；第一次答案保持不變。", "R-F14-4 · SUBMISSION_CONFLICT");
      render();
    }

    function studentMultitab() {
      const sq = getCurrentStudentQuestion();
      const submission = sq ? getStudentSubmission(sq.id) : null;
      if (!submission) { studentSubmit(); return; }
      guard(false, "多分頁競態只允許一筆成功；其他請求回傳已存在/衝突。", "R-F14-5");
      render();
    }

    function copyCurrentCode() {
      const code = state.ui.mode === "student" ? getCurrentStudentSession()?.sessionCode : getTeacherSession()?.sessionCode;
      if (!code) { setToast("目前沒有可複製的 session code", "error", "prototype guard"); render(); return; }
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(code).catch(() => {});
      setToast(`已準備複製 ${code}`, "success", "session code 只用來尋找場次");
      render();
    }

    function teacherCreateCourse() {
      const account = state.domain.accounts.find(item => item.id === state.ui.teacher.accountId);
      if (!guard(Boolean(account?.canCreateCourse), "目前帳號沒有 can_create_course，不能建立 Course。", "R-F0-1 · R-F16-2")) { render(); return; }
      const name = String(state.ui.teacher.newCourseName || "").trim() || "未命名課程";
      const course = { id: nextId("course"), name, description: "由 prototype 展示用建立流程產生。", status: "draft", ownerAccountId: account.id };
      state.domain.courses.push(course);
      state.ui.teacher.courseId = course.id;
      succeed(`已建立 draft Course「${name}」，${account.displayName} 是唯一 owner。`, "R-F0-2 · R-F0-4");
      render();
    }

    function teacherArchiveCourse(courseId) {
      const course = getCourse(courseId);
      const active = state.domain.liveSessions.find(session => session.courseId === courseId && ["waiting", "active"].includes(session.status));
      if (!guard(Boolean(course) && course.status === "draft", "只有 draft Course 可以封存。", "R-F1-1")) { render(); return; }
      if (!guard(!active, "仍有 waiting/active LiveSession，不能封存。", "R-F1-3")) { render(); return; }
      course.status = "archived";
      course.archivedAt = "server fixture time";
      succeed(`Course「${course.name}」已 archived；歷史場次仍可查詢。`, "R-F1-3 · R-F1-4");
      render();
    }

    function teacherAttemptEdit(courseId) {
      const course = getCourse(courseId);
      if (!guard(Boolean(course) && course.status === "draft", "archived Course 不可編輯、恢復或建立新場次。", "R-F1-4 · COURSE_NOT_EDITABLE")) { render(); return; }
      state.ui.teacher.courseId = courseId;
      state.ui.teacher.view = "question-bank";
      render();
    }

    function teacherOpenEditor() {
      const course = getTeacherCourse();
      if (!guard(Boolean(course) && course.status === "draft", "archived Course 只讀，不能新增題目。", "R-F11-6 · COURSE_NOT_EDITABLE")) { render(); return; }
      state.ui.teacher.editorOpen = true;
      state.ui.teacher.editorDraft = createEditorDraft();
      state.ui.teacher.editorMessages = [];
      render();
    }

    function teacherAddOption() {
      const draft = state.ui.teacher.editorDraft;
      if (draft.type === "open_text") { setToast("open_text 禁止 options", "error", "R-F9-2 · FIELD_FORBIDDEN"); render(); return; }
      if (!guard(draft.options.length < 10, "選項最多 10 個。", "R-F9-1 · R-F9-3")) { render(); return; }
      draft.options.push("");
      render();
    }

    function teacherRemoveOption() {
      const draft = state.ui.teacher.editorDraft;
      if (draft.options.length <= 2) { setToast("選項至少要保留 2 個", "error", "R-F9-1 · OPTION_COUNT_INVALID"); render(); return; }
      draft.options.pop();
      draft.correctIndices = draft.correctIndices.filter(index => index < draft.options.length);
      render();
    }

    function validateQuestionPayload(payload, index = 0, existingQuestions = []) {
      const messages = [];
      const prefix = `questions[${index}]`;
      const prompt = String(payload.prompt ?? "").trim();
      if (!prompt) messages.push({ code: "FIELD_REQUIRED", path: `${prefix}.prompt`, message: "題幹不可為空白。", blocking: true, next: "輸入 1–1,000 個純文字字元" });
      if (charCount(prompt) > 1000) messages.push({ code: "TEXT_TOO_LONG", path: `${prefix}.prompt`, message: "題幹超過 1,000 個 Unicode 字元。", blocking: true, next: "縮短題幹" });
      if (payload.type === "poll") {
        if (!["single", "multiple"].includes(payload.selectionMode)) messages.push({ code: "FIELD_REQUIRED", path: `${prefix}.selection_mode`, message: "poll 必須指定 single 或 multiple。", blocking: true, next: "選擇模式" });
        validateOptions(payload.options || [], prefix, messages);
        if (payload.correctOptionRefs?.length) messages.push({ code: "FIELD_FORBIDDEN", path: `${prefix}.correct_option_refs`, message: "poll 不允許 correct_option_refs。", blocking: true, next: "移除正確答案欄位" });
      } else if (payload.type === "open_text") {
        if ((payload.options || []).length) messages.push({ code: "FIELD_FORBIDDEN", path: `${prefix}.options`, message: "open_text 不允許 options。", blocking: true, next: "移除 options" });
        if (payload.selectionMode) messages.push({ code: "FIELD_FORBIDDEN", path: `${prefix}.selection_mode`, message: "open_text 不允許 selection_mode。", blocking: true, next: "移除 selection_mode" });
        if (payload.correctOptionRefs?.length) messages.push({ code: "FIELD_FORBIDDEN", path: `${prefix}.correct_option_refs`, message: "open_text 不允許正確答案欄位。", blocking: true, next: "移除 correct refs" });
      } else if (payload.type === "quiz") {
        validateOptions(payload.options || [], prefix, messages);
        if (payload.selectionMode) messages.push({ code: "FIELD_FORBIDDEN", path: `${prefix}.selection_mode`, message: "quiz 不允許 selection_mode；由正解數量推導。", blocking: true, next: "移除 selection_mode" });
        const refs = payload.correctOptionRefs || [];
        const known = new Set((payload.options || []).map(option => option.ref || option.id));
        if (!refs.length || refs.some(ref => !known.has(ref))) messages.push({ code: "CORRECT_OPTION_INVALID", path: `${prefix}.correct_option_refs`, message: "quiz 必須至少有一個存在於 options 的正確答案。", blocking: true, next: "勾選至少一個正解" });
      } else messages.push({ code: "TYPE_INVALID", path: `${prefix}.type`, message: "題型必須是 poll、open_text 或 quiz。", blocking: true, next: "選擇支援題型" });
      const duplicatePrompt = existingQuestions.some(question => normalizeOption(question.prompt) === normalizeOption(prompt) && prompt);
      if (duplicatePrompt) messages.push({ code: "QUESTION_DUPLICATE_WARNING", path: `${prefix}.prompt`, message: "可能與 Course 內既有題幹重複；這是 warning，不會自動合併。", blocking: false, next: "確認是否仍要建立" });
      return messages;
    }

    function validateOptions(options, prefix, messages) {
      if (options.length < 2 || options.length > 10) messages.push({ code: "OPTION_COUNT_INVALID", path: `${prefix}.options`, message: "options 數量必須介於 2–10。", blocking: true, next: "調整選項數量" });
      const seen = new Map();
      options.forEach((option, index) => {
        const text = String(option.text ?? option ?? "").trim();
        if (!text) messages.push({ code: "FIELD_REQUIRED", path: `${prefix}.options[${index}].text`, message: "選項不可為空白。", blocking: true, next: "輸入選項文字" });
        if (charCount(text) > 250) messages.push({ code: "TEXT_TOO_LONG", path: `${prefix}.options[${index}].text`, message: "選項超過 250 個字元。", blocking: true, next: "縮短選項" });
        const normalized = normalizeOption(text);
        if (normalized && seen.has(normalized)) messages.push({ code: "OPTION_DUPLICATE", path: `${prefix}.options[${index}].text`, message: `與 options[${seen.get(normalized)}] 正規化後重複。`, blocking: true, next: "改寫成不同選項" });
        if (normalized) seen.set(normalized, index);
      });
    }

    function editorPayload() {
      const draft = state.ui.teacher.editorDraft;
      const options = draft.options.map((text, index) => ({ id: `draft-opt-${index + 1}`, text, isCorrect: draft.correctIndices.includes(index), position: index + 1 }));
      return { type: draft.type, prompt: draft.prompt, selectionMode: draft.type === "poll" ? draft.selectionMode : null, options, correctOptionRefs: draft.type === "quiz" ? draft.correctIndices.map(index => `draft-opt-${index + 1}`) : [] };
    }

    function teacherValidateSingle() {
      const course = getTeacherCourse();
      if (!guard(Boolean(course) && course.status === "draft", "archived Course 不可修改題目。", "R-F11-6 · COURSE_NOT_EDITABLE")) { render(); return; }
      const payload = editorPayload();
      const messages = validateQuestionPayload(payload, 0, state.domain.questionDefinitions.filter(item => item.courseId === course.id));
      state.ui.teacher.editorMessages = messages;
      if (messages.some(item => item.blocking)) { addEvent("單題 validation 發現 blocking error，沒有建立資料。", "error", "R-F9 · R-F10"); render(); return; }
      const options = payload.options.map((option, index) => ({ id: nextId("option"), text: String(option.text).trim(), isCorrect: payload.type === "quiz" && payload.correctOptionRefs.includes(option.id), position: index + 1 }));
      const question = { id: nextId("question"), courseId: course.id, type: payload.type, prompt: String(payload.prompt).trim(), selectionMode: payload.selectionMode, position: state.domain.questionDefinitions.filter(item => item.courseId === course.id).length + 1, options };
      state.domain.questionDefinitions.push(question);
      state.ui.teacher.editorOpen = false;
      succeed(`已建立 ${question.type} 題目；題目依序附加到 Course 末端。`, "R-F11-4");
      render();
    }

    function makeBatchFixture(kind) {
      if (kind === "over-limit") return { count: 51, items: [] };
      if (kind === "invalid") return { count: 3, items: [
        { clientRef: "invalid-01", type: "poll", prompt: "x".repeat(1001), selectionMode: "single", options: [{ ref: "a", text: "同一個" }, { ref: "b", text: " 同一個 " }], correctOptionRefs: [] },
        { clientRef: "invalid-02", type: "open_text", prompt: "帶了不該存在的選項", selectionMode: null, options: [{ ref: "a", text: "不允許" }, { ref: "b", text: "欄位" }], correctOptionRefs: [] },
        { clientRef: "invalid-03", type: "quiz", prompt: "缺少正確答案", selectionMode: "single", options: [{ ref: "a", text: "選項 A" }, { ref: "b", text: "選項 B" }], correctOptionRefs: [] }
      ] };
      return { count: 3, items: [
        { clientRef: "valid-01", type: "poll", prompt: "今天最想練習哪個步驟？", selectionMode: "single", options: [{ ref: "a", text: "拆解問題" }, { ref: "b", text: "檢查證據" }], correctOptionRefs: [] },
        { clientRef: "valid-02", type: "quiz", prompt: "哪些做法可以降低誤判？", selectionMode: null, options: [{ ref: "a", text: "交叉查證" }, { ref: "b", text: "確認時間" }, { ref: "c", text: "只看標題" }], correctOptionRefs: ["a", "b"] },
        { clientRef: "valid-03", type: "open_text", prompt: "今天帶走的一句提醒？", selectionMode: null, options: [], correctOptionRefs: [] }
      ] };
    }

    function loadBatchFixture(announce = true) {
      state.ui.teacher.batchDraft = makeBatchFixture(state.ui.teacher.batchFixture);
      state.ui.teacher.batchRevision += 1;
      state.ui.teacher.batchStatus = "idle";
      state.ui.teacher.batchMessages = [];
      state.ui.teacher.batchPreviewVisible = false;
      state.ui.teacher.batchPreviewRevision = null;
      if (announce) addEvent(`載入批次 fixture：${state.ui.teacher.batchFixture}`, "info", "R-F10-3");
      render();
    }

    function validateBatch(announce = true) {
      const course = getTeacherCourse();
      const batch = state.ui.teacher.batchDraft;
      if (!batch) { setToast("先載入一組批次 fixture", "error", "R-F10-3"); render(); return; }
      if (!guard(Boolean(course) && course.status === "draft", "archived Course 不可建立批次題目。", "R-F11-6 · COURSE_NOT_EDITABLE")) { render(); return; }
      let messages = [];
      if (batch.count < 1 || batch.count > 50) messages.push({ code: "BATCH_SIZE_INVALID", path: "payload", message: `目前批次為 ${batch.count} 題；允許 1–50 題。`, blocking: true, next: "拆成較小批次" });
      const refs = new Map();
      batch.items.forEach((item, index) => {
        if (refs.has(item.clientRef)) messages.push({ code: "CLIENT_REF_DUPLICATE", path: `questions[${index}].client_ref`, message: `與 questions[${refs.get(item.clientRef)}] 重複。`, blocking: true, next: "改用唯一 client_ref" });
        refs.set(item.clientRef, index);
        messages = messages.concat(validateQuestionPayload(item, index, state.domain.questionDefinitions.filter(question => question.courseId === course.id)));
      });
      state.ui.teacher.batchMessages = messages;
      state.ui.teacher.batchStatus = messages.some(item => item.blocking) ? "invalid" : "valid";
      state.ui.teacher.batchPreviewVisible = false;
      state.ui.teacher.batchPreviewRevision = null;
      if (announce) addEvent(state.ui.teacher.batchStatus === "valid" ? "批次 validation 通過；下一步是 preview。" : "批次 validation 有 blocking error；依 all-or-nothing 不建立任何題目。", state.ui.teacher.batchStatus === "valid" ? "success" : "error", "R-F10-4 · R-F10-5");
      render();
    }

    function mutateBatch() {
      const batch = state.ui.teacher.batchDraft;
      if (!batch || !batch.items.length) { setToast("over-limit fixture 沒有可修改的題目表單", "error", "prototype guard"); render(); return; }
      batch.items[0].prompt = `${batch.items[0].prompt}（已修改）`;
      state.ui.teacher.batchRevision += 1;
      state.ui.teacher.batchStatus = "stale";
      state.ui.teacher.batchPreviewVisible = false;
      state.ui.teacher.batchPreviewRevision = null;
      addEvent("payload 已改變，舊 preview 失效；必須重新 validation。", "error", "R-F11-2");
      render();
    }

    function teacherShowPreview() {
      if (!guard(state.ui.teacher.batchStatus === "valid", "必須先有沒有 blocking error 的 validation 結果。", "R-F11-1")) { render(); return; }
      state.ui.teacher.batchPreviewVisible = true;
      state.ui.teacher.batchPreviewRevision = state.ui.teacher.batchRevision;
      addEvent("已產生本 revision 的完整 preview，等待明確 confirm。", "info", "R-F11-1 · R-F11-2");
      render();
    }

    function teacherConfirmBatch() {
      const teacher = state.ui.teacher;
      const course = getTeacherCourse();
      if (!guard(teacher.batchStatus === "valid" && teacher.batchPreviewVisible && teacher.batchPreviewRevision === teacher.batchRevision, "preview 已失效或尚未明確確認；請重新 validation/preview。", "R-F11-2 · R-F11-3")) { render(); return; }
      if (!guard(Boolean(course) && course.status === "draft", "archived Course 不可建立題目。", "R-F11-6 · COURSE_NOT_EDITABLE")) { render(); return; }
      const existing = state.domain.questionDefinitions.filter(item => item.courseId === course.id);
      teacher.batchDraft.items.forEach((item, index) => {
        const options = (item.options || []).map((option, optionIndex) => ({ id: nextId("option"), text: String(option.text).trim(), isCorrect: item.correctOptionRefs.includes(option.ref), position: optionIndex + 1 }));
        state.domain.questionDefinitions.push({ id: nextId("question"), courseId: course.id, type: item.type, prompt: String(item.prompt).trim(), selectionMode: item.selectionMode, position: existing.length + index + 1, options });
      });
      teacher.batchCreatedCount = teacher.batchDraft.items.length;
      teacher.batchStatus = "created";
      teacher.batchPreviewVisible = false;
      succeed(`批次已依 preview 順序建立 ${teacher.batchCreatedCount} 題。`, "R-F11-3 · R-F11-4");
      render();
    }

    function teacherCreateSession() {
      const course = getTeacherCourse();
      const existing = state.domain.liveSessions.find(session => session.courseId === course?.id && ["waiting", "active"].includes(session.status));
      const selected = state.ui.teacher.selectedQuestionIds;
      if (!guard(Boolean(course) && course.status === "draft", "只有 draft Course 可以建立 LiveSession。", "R-F1-2")) { render(); return; }
      if (!guard(!existing, "同一 Course 已有 waiting/active 場次，不能建立第二場。", "R-F2-1")) { render(); return; }
      if (!guard(selected.length > 0, "至少選擇一題才能建立場次。", "R-F4-2")) { render(); return; }
      const id = nextId("session");
      const code = "D5X7K2M9";
      const session = { id, courseId: course.id, status: "waiting", sessionCode: code, selectedQuestionIds: [...selected], activeQuestionId: null, joinedCount: 0, autoClosed: false };
      state.domain.liveSessions.push(session);
      state.ui.teacher.sessionId = id;
      state.ui.teacher.view = "setup";
      succeed(`已建立 waiting LiveSession ${code}。`, "R-F2-1 · R-F2-2");
      render();
    }

    function teacherMoveQuestion(questionId, direction) {
      const selected = state.ui.teacher.selectedQuestionIds;
      const index = selected.indexOf(questionId);
      if (index < 0) return;
      const next = direction === "up" ? index - 1 : index + 1;
      if (next < 0 || next >= selected.length) return;
      [selected[index], selected[next]] = [selected[next], selected[index]];
      render();
    }

    function teacherStartSession() {
      const session = getTeacherSession();
      if (!guard(Boolean(session) && session.status === "waiting", "只有 waiting 場次可以開始。", "R-F2-2")) { render(); return; }
      const selectedIds = session.selectedQuestionIds || state.ui.teacher.selectedQuestionIds;
      if (!guard(selectedIds.length > 0, "場次沒有選定題目。", "R-F4-2")) { render(); return; }
      const existing = getSessionQuestions(session.id);
      if (!existing.length) selectedIds.forEach((questionId, index) => {
        const source = getQuestion(questionId);
        if (!source) return;
        state.domain.sessionQuestions.push({ id: `sq-${session.id}-${index + 1}`, liveSessionId: session.id, sourceQuestionId: source.id, position: index + 1, status: "not_open", openedAt: null, closedAt: null, snapshot: makeSnapshot(source), aggregate: makeAggregate(source) });
      });
      session.status = "active";
      session.startedAt = "server fixture time";
      session.activeQuestionId = getSessionQuestions(session.id)[0]?.id || null;
      state.ui.teacher.view = "classroom";
      succeed("場次 active；SessionQuestion snapshot 已在同一個 fixture transaction 建立。", "R-F2-3 · R-F2-4");
      render();
    }

    function makeSnapshot(source) {
      return { type: source.type, prompt: source.prompt, selectionMode: source.selectionMode || null, options: (source.options || []).map(option => ({ id: `snap-${option.id}`, text: option.text, isCorrect: Boolean(option.isCorrect), position: option.position })) };
    }

    function makeAggregate(source) {
      return { total: 0, options: (source.options || []).map(option => ({ id: `snap-${option.id}`, text: option.text, count: 0 })), textResponses: [] };
    }

    function teacherCancelSession() {
      const session = getTeacherSession();
      const hasSubmission = state.domain.submissions.some(item => item.liveSessionId === session?.id);
      if (!guard(Boolean(session) && session.status === "waiting" && !hasSubmission, "只有沒有 Submission 的 waiting 場次可以取消。", "R-F2-5")) { render(); return; }
      session.status = "cancelled";
      session.closedAt = "server fixture time";
      state.ui.teacher.view = "setup";
      succeed(`場次 ${session.sessionCode} 已 cancelled，且不可恢復。`, "R-F2-5 · R-F2-6");
      render();
    }

    function teacherOpenQuestion(questionId) {
      const session = getTeacherSession();
      const sq = getSessionQuestion(questionId);
      const otherOpen = session ? getSessionQuestions(session.id).find(item => item.status === "open") : null;
      if (!guard(Boolean(session) && session.status === "active", "只有 active LiveSession 可以 open 題目。", "R-F2-4")) { render(); return; }
      if (!guard(Boolean(sq) && sq.liveSessionId === session.id, "題目不屬於這個 Session。", "R-F4-3")) { render(); return; }
      if (!guard(sq.status === "not_open", "closed 題目不能重開。", "R-F4-6")) { render(); return; }
      if (!guard(!otherOpen, `目前已有 ${shortText(otherOpen?.snapshot.prompt, 30)} open；先 close 才能換題。`, "R-F4-5")) { render(); return; }
      sq.status = "open";
      sq.openedAt = "server fixture time";
      session.activeQuestionId = sq.id;
      state.ui.fixture.pulse = true;
      succeed(`已 open 第 ${sq.position} 題；同場最多一題 open。`, "R-F4-5");
      render();
    }

    function teacherCloseQuestion(questionId) {
      const session = getTeacherSession();
      const sq = getSessionQuestion(questionId);
      if (!guard(Boolean(session) && session.status === "active" && sq?.status === "open", "目前只有 active + open 題目可以 close。", "R-F15-1")) { render(); return; }
      sq.status = "closed";
      sq.closedAt = "server fixture time";
      succeed("題目已 closed；統計自動公布給全班，沒有獨立 publish。", "R-F17-2 · R-F15-1");
      render();
    }

    function teacherReopenQuestion(questionId) {
      const sq = getSessionQuestion(questionId);
      if (!guard(false, "closed SessionQuestion 不可在同一場次重新 open。", "R-F4-6")) { render(); return; }
      if (sq) render();
    }

    function teacherCloseSession(autoClosed) {
      const session = getTeacherSession();
      if (!guard(Boolean(session) && session.status === "active", "只有 active 場次可以結束。", "R-F2-6")) { render(); return; }
      getSessionQuestions(session.id).filter(item => item.status === "open").forEach(item => { item.status = "closed"; item.closedAt = "server fixture time"; });
      session.status = "closed";
      session.closedAt = autoClosed ? "server fixture time (+8h fixture)" : "server fixture time";
      session.autoClosed = Boolean(autoClosed);
      if (!state.domain.archivedResults.some(result => result.liveSessionId === session.id)) state.domain.archivedResults.push({ id: nextId("result"), liveSessionId: session.id, courseId: session.courseId, closedAt: session.closedAt, retentionExpiresAt: "closed + 90 days fixture", status: "available", questionCount: getSessionQuestions(session.id).length });
      succeed(autoClosed ? "LiveSession 已模擬 +8 小時自動 closed；code、加入、重連、提交全部失效。" : "LiveSession 已 closed；可在歷史結果查詢。", autoClosed ? "R-F2-7 · W8 fixture" : "R-F2-6");
      render();
    }

    function teacherEditSource(questionId) {
      const question = getQuestion(questionId);
      if (!guard(Boolean(question) && getCourse(question.courseId)?.status === "draft", "archived Course 不可編輯題目。", "R-F11-6 · COURSE_NOT_EDITABLE")) { render(); return; }
      question.prompt = `${question.prompt}（來源已更新）`;
      const snapshot = state.domain.sessionQuestions.find(item => item.sourceQuestionId === questionId && item.liveSessionId === state.ui.teacher.sessionId);
      addEvent(`來源 QuestionDefinition 已修改；${snapshot ? "本場 snapshot 保持原題幹" : "尚無本場 snapshot"}。`, "success", "R-F4-4");
      render();
    }

    document.addEventListener("input", handleInput);
    document.addEventListener("change", handleChange);
    document.addEventListener("submit", handleSubmit);
    document.addEventListener("click", handleClick);

    // Chart marks get a keyboard/focus tooltip as well as a native title-free custom layer.
    document.addEventListener("mouseover", event => {
      const mark = event.target.closest("[data-tooltip-title]");
      if (mark) showTooltip(mark, event.clientX, event.clientY);
    });
    document.addEventListener("mousemove", event => {
      const mark = event.target.closest("[data-tooltip-title]");
      if (mark) showTooltip(mark, event.clientX, event.clientY);
    });
    document.addEventListener("focusin", event => {
      const mark = event.target.closest("[data-tooltip-title]");
      if (mark) showTooltip(mark, event.clientX || window.innerWidth / 2, event.clientY || window.innerHeight / 2);
    });
    document.addEventListener("mouseout", event => { if (!event.relatedTarget?.closest?.("[data-tooltip-title]")) hideTooltip(); });
    document.addEventListener("focusout", event => { if (!event.relatedTarget?.closest?.("[data-tooltip-title]")) hideTooltip(); });

    function showTooltip(mark, x, y) {
      const tooltip = document.getElementById("chart-tooltip");
      if (!tooltip) return;
      tooltip.hidden = false;
      tooltip.innerHTML = `<strong>${esc(mark.dataset.tooltipValue || "")}</strong><span>${esc(mark.dataset.tooltipTitle || "")}</span>`;
      const left = Math.min(Math.max(10, x + 12), window.innerWidth - 280);
      const top = Math.min(Math.max(10, y + 12), window.innerHeight - 74);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
      const tooltip = document.getElementById("chart-tooltip");
      if (tooltip) tooltip.hidden = true;
    }

    window.__智學互動Prototype = {
      reset: () => { state = createState(); render(); },
      loadScenario,
      summary: () => ({ mode: state.ui.mode, scenario: state.ui.fixture.scenarioId, studentView: state.ui.student.view, teacherView: state.ui.teacher.view, course: state.ui.teacher.courseId, session: state.ui.student.sessionId, submissions: state.domain.submissions.length })
    };

    render();
  </script>
</body>
</html>
